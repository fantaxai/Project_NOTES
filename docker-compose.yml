services:
  frontend:
    build:
      context: ./notes_frontend/notes-vue-app
      dockerfile: ../../docker/Dockerfile.frontend  
    container_name: vue_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./notes_frontend/notes-vue-app:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./notes
      dockerfile: ../docker/Dockerfile.backend
    container_name: django_backend
    ports:
      - "8000:8000"
    volumes:
      - ./notes:/app
    environment:
      - DEBUG=1