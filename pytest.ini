[pytest]
DJANGO_SETTINGS_MODULE = notes.settings
python_files = tests.py test_*.py *_tests.py
addopts = 
    --strict-markers
    --cov=note
    --cov-report=html
    --cov-report=term
    -v
    --tb=short
markers =
    slow: marks tests as slow
    integration: integration tests
    unit: unit tests