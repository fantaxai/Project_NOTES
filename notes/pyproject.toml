[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", "venv", ".git"]
skip_glob = ["*/migrations/*", "*/tests/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/", "venv/", "tests/"]
plugins = []
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true